[build-system]
requires = ["setuptools>=78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-ai-cs6013"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "accelerate==1.14.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "antlr4-python3-runtime==4.13.2",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "cuda-bindings==12.9.7",
    "cuda-pathfinder==1.8.0",
    "datasets==5.0.1",
    "defuser==0.0.25",
    "device-smi==0.5.7",
    "dill==0.4.1",
    "distro==1.9.0",
    "filelock==3.32.4",
    "frozenlist==1.8.0",
    "fsspec==2026.6.0",
    "gptqmodel==7.3.2",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpcore2==2.12.0",
    "httpx==0.28.1",
    "httpx2==2.12.0",
    "huggingface-hub==1.29.0",
    "idna==3.19",
    "jinja2==3.1.6",
    "jiter==0.16.0",
    "joblib==1.5.3",
    "latex2sympy2-extended==1.11.0",
    "logbar==0.4.14",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "math-verify==0.9.0",
    "maturin==1.15.0",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "multidict==6.7.1",
    "multiprocess==0.70.19",
    "narwhals==2.25.0",
    "networkx==3.6.1",
    "ninja==1.13.0",
    "numpy==2.2.6",
    "openai==3.0.0",
    "optimum==2.3.0",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "propcache==0.5.2",
    "protobuf==7.36.0",
    "psutil==7.2.2",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pygments==2.21.0",
    "pypcre==0.6.2",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "requests==2.34.2",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "setuptools==78.1.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tokenicer==0.0.14",
    "tokenizers==0.23.1",
    "torchcodec==0.15.0",
    "tqdm==4.70.0",
    "transformers==5.16.1",
    "truststore==0.10.4",
    "typer==0.27.2",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.7.0",
    "vllm==0.22.0",
    "xxhash==4.0.1",
    "yarl==1.24.5",
]

[project.optional-dependencies]
cuda129 = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
]

[tool.uv]
# Scripts-only repo: don't try to build/install it as a package.
package = false
index-strategy = "unsafe-best-match"
# vllm only publishes Linux wheels; skip resolving for other platforms.
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129" },
]
torchvision = [
    { index = "pytorch-cu129" },
]
torchaudio = [
    { index = "pytorch-cu129" },
]
